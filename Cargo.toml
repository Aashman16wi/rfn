[package]
name = "rfn"
version = "0.1.0"
edition = "2024"
description = "A minimal async terminal file manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aashman16wi/rfn"

[dependencies]
# TUI framework
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# File system
walkdir = "2"
mime_guess = "2.0"

# Git
git2 = "0.18"

# Config
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Icons
unicode-width = "0.1"

# Archive preview
zip = { version = "0.6", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
xz2 = { version = "0.1", optional = true }
bzip2 = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }

# Video/Audio preview (uses ffprobe/ffmpeg)
serde_json = "1.0"

# Utils
anyhow = "1.0"
thiserror = "1.0"
opener = "0.6"

[features]
default = ["image-preview", "pdf-preview", "archive-preview"]
# Image rendering is wired up with ratatui-image in the next commit.
image-preview = []
# PDF preview shells out to poppler-utils (pdftotext/pdftoppm).
pdf-preview = []
archive-preview = ["dep:zip", "dep:tar", "dep:flate2", "dep:xz2", "dep:bzip2", "dep:zstd"]

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"