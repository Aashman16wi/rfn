[package]
name = "rfn"
version = "0.1.0"
edition = "2024"
description = "A minimal async terminal file manager"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aashman16wi/rfn"

[dependencies]
# TUI framework
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# File system
ignore = "0.4"
walkdir = "2"
mime_guess = "2.0"

# Git
git2 = "0.18"

# Config
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

# Icons
unicode-width = "0.1"

# Image preview (optional, feature-gated - using Kitty/iTerm/Sixel protocols directly)
image = { version = "0.25", optional = true }
base64 = { version = "0.22", optional = true }
sixel = { version = "0.3", optional = true }

# Utils
anyhow = "1.0"
thiserror = "1.0"
crossbeam-channel = "0.5"
opener = "0.6"

[features]
default = []
image-preview = ["image", "base64", "sixel"]

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"