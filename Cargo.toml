[package]
name = "rfn"
version = "0.1.0"
edition = "2024"
description = "A minimal async terminal file manager"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
# TUI framework
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# File system
mime_guess = "2.0"

# Git
git2 = "0.18"

# Config
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Icons
unicode-width = "0.1"

# Image preview
ratatui-image = "8"
image = "0.25"

# Archive preview
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.4"
zstd = "0.13"

# Video/Audio preview (uses ffprobe/ffmpeg)
serde_json = "1.0"

# Utils
anyhow = "1.0"
thiserror = "1.0"
opener = "0.6"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"